week: 5
random_seed: 42

evaluation:
  tuning_split: validation
  final_test_policy: once_after_model_selection

search:
  random_forest_trials: 8
  lightgbm_trials: 12

selection:
  primary:
    segment: ACTIVE_PEAK
    horizon_min: 30
    metric: mae
    direction: minimize
  secondary:
    metric: mean_mae
    direction: minimize
  tertiary:
    metric: inference_ms_per_1k_rows
    direction: minimize
    preferred_max: 200
  tie_breaker: simpler_model

candidates:
  random_forest:
    n_estimators: [200, 400]
    max_depth: [12, 20, null]
    min_samples_leaf: [1, 3, 5]
    max_features: ["sqrt", 0.7]

  lightgbm:
    num_leaves: [31, 63, 127]
    learning_rate: [0.03, 0.05, 0.1]
    min_child_samples: [20, 50, 100]
    feature_fraction: [0.7, 0.85, 1.0]
    n_estimators: [300, 600, 1000]

importance:
  top_n: 15
  permutation_repeats: 5

artifacts:
  model_dir: models/week05
  report_dir: reports/week05
