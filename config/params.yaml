# ============================================================
# Shared Project Parameters
# Seoul Bike Availability Dashboard
# ============================================================

RANDOM_SEED: 42

HORIZONS:
  - 15
  - 30
  - 60

SNAPSHOT_INTERVAL_MIN: 5

AVAIL_MIN: 1
AVAIL_STABLE: 2

PEAK_HOURS:
  morning:
    start: "07:00"
    end: "09:00"

  evening:
    start: "18:00"
    end: "20:00"

S_MIN:
  capacity_ratio: 0.20
  minimum: 1

E_MIN:
  capacity_ratio: 0.20
  minimum: 1

URGENCY:
  15: 4.0
  30: 2.0
  60: 1.0

DEMAND_WEIGHT:
  minimum: 0.5
  maximum: 2.0

SEARCH_RADIUS_KM: 2.0

# 근거 확인 전까지 가정값으로 관리
VEHICLE_CAP: 20

WALK_SPEED_KMH: 4.0
BIKE_SPEED_KMH: 15.0

DETOUR_FACTOR: 1.3

INTERVENTION_THRESHOLD: 5

MAX_WALK_M: 800
AVAIL_STABLE_TARGET: 3

RECOMMENDATION_WEIGHT:
  distance: 0.5
  availability: 0.5

# KMA AWS Seongdong (verified in Week 1; see docs/weekly/week-01-weather-station-selection.md)
WEATHER_STATION: 421

ACTIVE_STATION:
  # Top 25% by training-period rental + return count
  percentile: 0.75

EVALUATION:
  # Engineering targets fixed before test evaluation; not yet empirical release gates
  target_status: provisional
  test_days: 28
  validation_days: 14
  minimum_history_days: 90
  baseline_mae_improvement_min: 0.10
  availability_precision_min: 0.80
  availability_recall_min: 0.85
  availability_f1_min: 0.80
  top3_availability_hit_rate_min: 0.90
  rebalancing_shortage_reduction_min: 0.10
  rebalancing_overflow_reduction_min: 0.10

# Week 04 candidate comparison. Model selection uses validation only; the
# labelled test period remains untouched until the Week 05 final evaluation.
WEEK04_MODEL_COMPARISON:
  seed: 42
  split:
    train_ratio: 0.70
    validation_ratio: 0.15
    test_ratio: 0.15
    gap_minutes: 60
  inference_timing_repeats: 5
  models:
    linear_model:
      alpha: 1.0
      fit_intercept: true
      solver: lsqr
      tol: 0.0001
      max_iter: 100
    random_forest:
      n_estimators: 48
      max_depth: 16
      min_samples_leaf: 25
      max_features: 0.75
      bootstrap: true
      max_samples: 0.20
      n_jobs: -1
    lightgbm:
      objective: regression_l1
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 50
      subsample: 0.80
      colsample_bytree: 0.80
      reg_lambda: 0.10
      deterministic: true
      force_col_wise: true
      verbosity: -1
      n_jobs: -1

STATION_MASTER_POLICY:
  refresh_interval_days: 7
  minimum_history_days_new_station: 14

LLM:
  temperature: 0.2
  timeout_sec: 3

# Inventory freshness policy
INVENTORY_FRESH_MAX_MIN: 5
INVENTORY_CACHE_MAX_STALE_MIN: 30

# Project geographic scope
PROJECT_AREA:
  service_districts:
    - "광진구"
    - "성동구"
  model_training_districts:
    - "광진구"
    - "성동구"
