# ============================================================
# Shared Project Parameters
# Seoul Bike Availability Dashboard
# ============================================================

RANDOM_SEED: 42

HORIZONS:
  - 15
  - 30
  - 60

SNAPSHOT_INTERVAL_MIN: 5

AVAIL_MIN: 1
AVAIL_STABLE: 2

PEAK_HOURS:
  morning:
    start: "07:00"
    end: "09:00"

  evening:
    start: "18:00"
    end: "20:00"

S_MIN:
  capacity_ratio: 0.20
  minimum: 1

E_MIN:
  capacity_ratio: 0.20
  minimum: 1

URGENCY:
  15: 4.0
  30: 2.0
  60: 1.0

DEMAND_WEIGHT:
  minimum: 0.5
  maximum: 2.0

SEARCH_RADIUS_KM: 2.0

# 근거 확인 전까지 가정값으로 관리
VEHICLE_CAP: 20

WALK_SPEED_KMH: 4.0
BIKE_SPEED_KMH: 15.0

DETOUR_FACTOR: 1.3

INTERVENTION_THRESHOLD: 5

MAX_WALK_M: 800
AVAIL_STABLE_TARGET: 3

RECOMMENDATION_WEIGHT:
  distance: 0.5
  availability: 0.5

# 1주차 직접 확인 후 확정
WEATHER_STATION: null

ACTIVE_STATION:
  # Top 25% by training-period rental + return count
  percentile: 0.75

EVALUATION:
  test_days: 28
  validation_days: 14
  minimum_history_days: 90
  baseline_mae_improvement_min: 0.10
  availability_precision_min: 0.80
  availability_recall_min: 0.85
  availability_f1_min: 0.80
  top3_availability_hit_rate_min: 0.90
  rebalancing_shortage_reduction_min: 0.10

STATION_MASTER_POLICY:
  refresh_interval_days: 7
  minimum_history_days_new_station: 14

LLM:
  temperature: 0.2
  timeout_sec: 3

# Inventory freshness policy
INVENTORY_FRESH_MAX_MIN: 5
INVENTORY_CACHE_MAX_STALE_MIN: 30

# Project geographic scope
PROJECT_AREA:
  service_districts:
    - "광진구"
    - "성동구"
  model_training_districts:
    - "광진구"
    - "성동구"
