spring.application.name=ddareungi

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

seoul.api.key=${SEOUL_OPEN_DATA_API_KEY}
kakao.api.key=${KAKAO_API_KEY}
tmap.api.key=${TMAP_API_KEY}
tmap.connect-timeout-ms=${TMAP_CONNECT_TIMEOUT_MS:2000}
tmap.read-timeout-ms=${TMAP_READ_TIMEOUT_MS:5000}

logging.file.name=logs/ddareungi.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

snapshot.cron=0 */5 * * * *

station.cron= 0 0 3 * * SUN

# Python FastAPI AI server
ai.server.url=${AI_SERVER_URL:http://localhost:8000}
ai.server.basic-user=${AI_SERVER_BASIC_USER:}
ai.server.basic-password=${AI_SERVER_BASIC_PASSWORD:}
ai.server.read-timeout-ms=${AI_SERVER_READ_TIMEOUT_MS:60000}
ai.server.predict-path=/predict
ai.server.rebalancing-path=/rebalancing
ai.server.recommend-path=/recommend
ai.server.operator-briefing-path=/llm/operator-briefing
ai.server.recommendation-reasons-path=/llm/recommendation-reasons

# Browser-facing LLM endpoints. Production must set LLM_AUTH_REQUIRED=true and
# inject LLM_API_TOKEN only at the trusted reverse proxy/backend boundary.
llm.auth.required=${LLM_AUTH_REQUIRED:false}
llm.api.token=${LLM_API_TOKEN:}
llm.rate-limit.requests-per-minute=${LLM_RATE_LIMIT_PER_MINUTE:20}
llm.max-request-bytes=${LLM_MAX_REQUEST_BYTES:65536}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Best-3 origin/destination route-pair ranking
recommendation.route.weight.origin=0.35
recommendation.route.weight.destination=0.35
recommendation.route.weight.eta=0.15
recommendation.route.weight.walking=0.15
recommendation.route.max-eta-min=90
recommendation.route.max-walking-min=20
